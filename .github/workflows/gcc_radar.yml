name: GCC Founding Lead Radar

on:
  schedule:
    - cron: '30 3 * * *'  # Runs automatically at 9:00 AM IST daily (3:30 AM UTC)
  workflow_dispatch:      # Allows manual trigger button from GitHub UI

jobs:
  run-gcc-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run GCC Tracker Engine
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python gcc_tracker.py

      - name: Commit Updated Database
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GCC Radar Bot"
          git add gcc_leads.db || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update GCC database [skip ci]" && git push)
